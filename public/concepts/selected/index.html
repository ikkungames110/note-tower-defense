<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>03 調整版 — 普通の鉛筆書き</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #171918;
        color: #e6e8e1;
        font-family: "Yu Gothic", Meiryo, sans-serif;
      }
      main {
        max-width: 1560px;
        margin: auto;
        padding: 30px 26px;
      }
      h1 {
        font-size: clamp(21px, 3vw, 31px);
        font-weight: 500;
        margin: 10px 0;
      }
      p {
        font-size: 13px;
        color: #aeb5a6;
        line-height: 1.9;
      }
      .eyebrow {
        font: 11px monospace;
        letter-spacing: 2px;
        color: #a1ad96;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 20px 0;
      }
      button,
      a {
        color: inherit;
      }
      button {
        font: inherit;
        font-size: 12px;
        border: 1px solid #4b5742;
        padding: 10px 18px;
        background: #252d20;
        border-radius: 5px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #b9c9a5;
        color: #1a2314;
        border-color: #b9c9a5;
      }
      a {
        font-size: 12px;
        color: #b4c49f;
        margin-right: 12px;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #d7e3c5;
        outline-offset: 3px;
      }
      figure {
        margin: 0;
      }
      figure img {
        width: 100%;
        display: block;
        border-radius: 5px;
      }
      figcaption {
        font-size: 12px;
        color: #aab39e;
        margin-top: 12px;
      }
      footer {
        margin-top: 24px;
      }
      @media (max-width: 600px) {
        main {
          padding: 20px 12px;
        }
        button {
          padding: 9px 13px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">SELECTED DIRECTION / 03 — REFINED</div>
      <h1>普通の鉛筆書きが、そのまま立つ。</h1>
      <p>
        03の構図と光、背景のぼけを保ち、周囲の破片・粉・攻撃線を取り除きました。<br />文字は重ね描きの荒い線から、普通に鉛筆で書いた素直な筆跡へ。
      </p>
      <div class="toolbar">
        <button id="after" aria-pressed="true">03 調整版</button
        ><button id="before" aria-pressed="false">修正前と比較</button
        ><a href="03-clean.png" target="_blank" rel="noopener"
          >調整版の元画像を開く ↗</a
        >
      </div>
      <figure>
        <img
          id="image"
          src="03-clean.png"
          alt="薄く立つ普通の鉛筆書きのあいうえおとABCDE。紙面に破片や攻撃線はない。"
        />
        <figcaption id="caption" aria-live="polite">
          03 調整版 — 周囲をきれいにし、普通の鉛筆書きに。
        </figcaption>
      </figure>
      <footer>
        <a href="../v2/index.html">第2回の10案</a
        ><a href="prompt.txt">生成プロンプト</a>
        <p>見た目を確認するためのコンセプト画像です。</p>
      </footer>
    </main>
    <script>
      const after = document.querySelector("#after"),
        before = document.querySelector("#before"),
        img = document.querySelector("#image"),
        caption = document.querySelector("#caption");
      function show(clean) {
        img.src = clean ? "03-clean.png" : "../v2/03.png";
        img.alt = clean
          ? "03調整版：普通の鉛筆書きの文字がノートの上に薄く立つ"
          : "03修正前：文字に重ね描きがあり、周囲に破片と攻撃線がある";
        after.setAttribute("aria-pressed", String(clean));
        before.setAttribute("aria-pressed", String(!clean));
        caption.textContent = clean
          ? "03 調整版 — 周囲をきれいにし、普通の鉛筆書きに。"
          : "03 修正前 — 第2回の案03。";
      }
      after.onclick = () => show(true);
      before.onclick = () => show(false);
    </script>
  </body>
</html>
